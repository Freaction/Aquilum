[workspace]
members = ["core", "native", "android"]
default-members = ["core", "native"]
resolver = "2"

[profile.release]
incremental = true
opt-level = "s"

[profile.release.package.aquilum-native]
opt-level = 3

[profile.release.package.vello_cpu]
opt-level = 3

[profile.release.package.vello_common]
opt-level = 3

[profile.release.package.fearless_simd]
opt-level = 3

[profile.release.package.glifo]
opt-level = 3

[profile.release.package.masonry_core]
opt-level = 3

[profile.release.package.masonry]
opt-level = 3

[profile.release.package.parley]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.skrifa]
opt-level = 3

[profile.release.package.read-fonts]
opt-level = 3

[profile.release.package.kurbo]
opt-level = 3

[profile.release.package.imaging]
opt-level = 3

[profile.release.package.peniko]
opt-level = 3

[profile.release.package.fontique]
opt-level = 3

[profile.release.package.bytemuck]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.adler2]
opt-level = 3

[profile.release.package.hayro]
opt-level = 3

[profile.release.package.hayro-syntax]
opt-level = 3

[profile.release.package.hayro-interpret]
opt-level = 3

[profile.release.package.hayro-font]
opt-level = 3

[profile.release.package.moxcms]
opt-level = 3

[patch."https://github.com/linebender/xilem"]
masonry_core = { path = "native/vendor/masonry_core" }
masonry = { path = "native/vendor/masonry" }

[patch.crates-io]
ratex-parser = { path = "native/vendor/ratex-parser" }
krilla = { path = "native/vendor/krilla" }
subsetter = { path = "native/vendor/subsetter" }
winit-android = { path = "native/vendor/winit-android" }
