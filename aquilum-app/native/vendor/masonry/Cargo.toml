[package]
name = "masonry"
version = "0.4.0"
edition = "2024"
description = "Форк masonry (xilem 271a27a) под Aquilum: parley 0.12"
license = "Apache-2.0"
repository = "https://github.com/linebender/xilem"

[dependencies]
accesskit = "0.24.0"
masonry_core = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88", default-features = false }
smallvec = "1.15.1"
tracing = { version = "0.1.44", default-features = false, features = ["default"] }
include_doc_path = { git = "https://github.com/linebender/xilem", rev = "271a27a6d4a930f7878d404f9014e3c50a3a9b88", package = "linebender_include_doc_path" }
resvg = { version = "0.47.0", default-features = false }
understory_virtual_list = "0.1.2"
skrifa = "0.44.0"
