[package]
name = "ratex-parser"
version = "0.1.14"
edition = "2021"
description = "Форк ratex-parser 0.1.14 под Aquilum: один движок регулярных выражений (regex)"
license = "MIT"
repository = "https://github.com/erweixin/RaTeX"

[dependencies]
ratex-types = "0.1.14"
ratex-font = "0.1.14"
ratex-lexer = "0.1.14"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
unicode-normalization = "0.1.25"
