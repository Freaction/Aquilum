[package]
name = "hayro"
version = "0.9.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LaurenzV/hayro"

[features]
default = ["embed-fonts", "embed-cmaps"]
embed-fonts = ["hayro-interpret/embed-fonts"]
embed-cmaps = ["hayro-interpret/embed-cmaps"]

[dependencies]
ab_glyph_rasterizer = { version = "0.1.10", default-features = false, features = ["std"] }
bytemuck = { version = "1", features = ["bytemuck_derive"] }
fearless_simd = "1.0.0"
hayro-interpret = { version = "=0.9.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
kurbo = "0.13"
pic-scale = { version = "0.7.12", default-features = false, features = ["neon", "sse", "avx"] }
rustc-hash = "2"
vello_cpu = { path = "../vello_cpu", default-features = false, features = ["std", "png"] }
