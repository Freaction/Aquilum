[package]
name = "aquilum-android"
version = "0.3.19"
description = "Aquilum for Android: the native app as a library for GameActivity"
authors = ["Dmitriy Chaplinskiy"]
license = "AGPL-3.0-only"
edition = "2024"
workspace = ".."

[lib]
name = "aquilum"
crate-type = ["cdylib"]

[dependencies]
aquilum-native = { path = "../native" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
