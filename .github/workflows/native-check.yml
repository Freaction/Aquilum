# Cross-platform check of the native app: release build (feature installed), a launch with a window
# and a screenshot, then the test suite. Run by hand before a release; it never touches releases.
name: Native check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to check
        required: true
        default: main
      platforms:
        description: 'Runners as a JSON list'
        required: true
        default: '["windows-latest","macos-latest","ubuntu-22.04"]'
      tests-only:
        description: Skip the release build and the window launch
        type: boolean
        default: false
      filter:
        description: Only tests whose name contains this text (empty = all)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get remove -y $(dpkg-query -W -f='${Package}\n' 'libunwind-*-dev' 2>/dev/null) || true
          sudo apt-get install -y libunwind-dev libgtk-3-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1-dev librsvg2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good xvfb imagemagick openbox wmctrl

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native
          key: native-check
          cache-on-failure: true

      - name: Release build
        if: ${{ !inputs.tests-only }}
        working-directory: aquilum-app
        run: cargo build --release -p aquilum-native --features installed

      - name: Sample vault
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/vault" "$RUNNER_TEMP/data" shots
          printf '# Проверка\n\nОбычный абзац с **жирным** и *курсивом*.\n\n- пункт\n- [ ] задача\n\n| a | b |\n| --- | --- |\n| 1 | 2 |\n\n```rust\nfn main() {}\n```\n' > "$RUNNER_TEMP/vault/Проверка.md"

      - name: Launch (Windows)
        if: ${{ runner.os == 'Windows' && !inputs.tests-only }}
        shell: pwsh
        run: |
          $vault = "$env:RUNNER_TEMP\vault"
          $exe = Resolve-Path ".artifacts\cargo-native\release\aquilum-native.exe"
          $p = Start-Process $exe -ArgumentList "--vault `"$vault`" --data-dir `"$env:RUNNER_TEMP\data`" --open `"$vault\Проверка.md`"" -PassThru
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots\windows.png")
          $p.Refresh()
          if ($p.HasExited) { "exited with code $($p.ExitCode)"; exit 1 }
          "window handle: $($p.MainWindowHandle)"
          $ok = $p.MainWindowHandle -ne 0
          Stop-Process $p -Force
          if (-not $ok) { exit 1 }

      - name: Launch (macOS)
        if: ${{ runner.os == 'macOS' && !inputs.tests-only }}
        run: |
          cat > check.swift <<'EOF'
          import CoreGraphics
          import Foundation
          let start = Date()
          while Date().timeIntervalSince(start) < 20 {
              let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
              if windows.contains(where: { ($0[kCGWindowOwnerName as String] as? String) == "aquilum-native" && ($0[kCGWindowLayer as String] as? Int) == 0 }) {
                  print(String(format: "Window visible after %.2f s", Date().timeIntervalSince(start)))
                  exit(0)
              }
              usleep(100_000)
          }
          print("Window not visible within 20 s")
          exit(1)
          EOF
          swiftc -O check.swift -o check
          ./.artifacts/cargo-native/release/aquilum-native --trace --metrics "$PWD/shots/metrics.json" --vault "$RUNNER_TEMP/vault" --data-dir "$RUNNER_TEMP/data" --open "$RUNNER_TEMP/vault/Проверка.md" > shots/app.log 2>&1 &
          pid=$!
          status=0
          ./check || status=$?
          sleep 3
          screencapture -x shots/macos-3s.png || true
          sleep 8
          screencapture -x shots/macos-11s.png || true
          if ! kill -0 $pid 2>/dev/null; then echo "app exited"; status=1; fi
          rm -f "$RUNNER_TEMP/data/window-state.json"
          osascript -e 'tell application "System Events" to set frontmost of first process whose name is "aquilum-native" to true' -e 'tell application "System Events" to keystroke "q" using command down' || echo "keystroke is not permitted on this runner"
          for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 0.5; done
          if kill -0 $pid 2>/dev/null; then
            echo "still running after Cmd+Q"
          elif [ -f "$RUNNER_TEMP/data/window-state.json" ]; then
            echo "window state saved on Cmd+Q"
          else
            echo "window state not saved on Cmd+Q"; status=1
          fi
          kill $pid 2>/dev/null || true
          echo "--- app.log"; head -40 shots/app.log || true
          echo "--- metrics"; cat shots/metrics.json 2>/dev/null || echo "no metrics: no frame was presented"
          moved=$(grep -c 'Moved(' shots/app.log || true)
          echo "window Moved events: $moved"
          if [ "$moved" -gt 20 ]; then echo "window keeps moving"; status=1; fi
          exit $status

      - name: Launch (Linux)
        if: ${{ runner.os == 'Linux' && !inputs.tests-only }}
        run: |
          ldd ./.artifacts/cargo-native/release/aquilum-native | sort | tee shots/ldd.txt
          Xvfb :99 -screen 0 1366x768x24 &
          export DISPLAY=:99
          sleep 2
          openbox &
          sleep 2
          ./.artifacts/cargo-native/release/aquilum-native --trace --vault "$RUNNER_TEMP/vault" --data-dir "$RUNNER_TEMP/data" --open "$RUNNER_TEMP/vault/Проверка.md" > shots/app.log 2>&1 &
          pid=$!
          sleep 12
          import -window root shots/linux.png || true
          status=0
          if ! kill -0 $pid 2>/dev/null; then echo "app exited"; status=1; fi
          wmctrl -lG | tee shots/wmctrl.txt
          wmctrl -i -r "$(wmctrl -l | awk 'NR==1{print $1}')" -b add,maximized_vert,maximized_horz || true
          sleep 3
          import -window root shots/linux-maximized.png || true
          wmctrl -lG | tee -a shots/wmctrl.txt
          echo "--- app.log"; grep -E 'SurfaceResized|Moved' shots/app.log | tail -10 || true
          widest=$(grep -o 'SurfaceResized(PhysicalSize { width: [0-9]*' shots/app.log | grep -oE '[0-9]+$' | sort -n | tail -1)
          echo "widest surface: ${widest:-none}"
          if [ "${widest:-0}" -le 1000 ]; then
            echo "window did not stretch to the screen"; status=1
            { pgrep -a openbox || echo "openbox is not running"; xwininfo -root -tree; } > shots/x11.txt 2>&1 || true
            sudo apt-get install -y gdb > /dev/null 2>&1 || true
            sudo gdb -p $pid -batch -ex "info threads" -ex "thread apply all bt 16" > shots/stacks.txt 2>&1 || true
            cat shots/x11.txt; head -200 shots/stacks.txt
          fi
          kill $pid 2>/dev/null || true
          exit $status

      - name: Crash log
        if: always()
        shell: bash
        run: cp "$RUNNER_TEMP/data/crash.log" shots/ 2>/dev/null || echo "no crash log"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-check-${{ matrix.platform }}
          path: shots/
          retention-days: 7

      - name: Tests
        if: always()
        working-directory: aquilum-app
        run: cargo test --workspace -- ${{ inputs.filter }}
        env:
          DISPLAY: ':99'
