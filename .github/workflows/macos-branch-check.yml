name: macOS branch check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build and check
        required: true
        default: mac-check
      printer:
        description: Add a dummy printer before the run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-version/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-version/src-tauri -> target
          key: branch-check

      - name: Install frontend dependencies
        working-directory: tauri-version
        run: npm ci

      - name: Build the app with the PDF export check
        working-directory: tauri-version
        env:
          VITE_E2E_PDF: /tmp/aquilum-e2e.pdf
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Install the app
        run: |
          ditto tauri-version/src-tauri/target/release/bundle/macos/Aquilum.app /Applications/Aquilum.app
          data="$HOME/Library/Application Support/com.dmitriy.aquilum-app"
          mkdir -p "$data"
          echo '{"updates":{"auto":false}}' > "$data/settings.json"
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || true

      - name: Printers before the run
        run: |
          lpstat -p -d 2>&1 || true
          if [ "${{ inputs.printer }}" = true ]; then
            ppd=$(find /System/Library/Frameworks/ApplicationServices.framework -name 'Generic.ppd' 2>/dev/null | head -1)
            echo "Generic PPD: $ppd"
            sudo lpadmin -p CIPrinter -E -v file:///dev/null ${ppd:+-P "$ppd"} || true
            sudo lpadmin -d CIPrinter || true
            lpstat -p -d 2>&1 || true
          fi

      - name: Launch, wait for the window and the PDF
        run: |
          cat > check.swift <<'EOF'
          import CoreGraphics
          import Foundation
          import PDFKit

          func waitFor(_ what: String, seconds: Double, _ done: () -> Bool) -> Bool {
              let start = Date()
              while Date().timeIntervalSince(start) < seconds {
                  if done() {
                      print(String(format: "%@ after %.2f s", what, Date().timeIntervalSince(start)))
                      return true
                  }
                  usleep(100_000)
              }
              print("\(what): not within \(Int(seconds)) s")
              return false
          }

          let windowShown = waitFor("Window visible", seconds: 20) {
              let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
              return windows.contains {
                  ($0[kCGWindowOwnerName as String] as? String) == "Aquilum" && ($0[kCGWindowLayer as String] as? Int) == 0
              }
          }
          let pdfURL = URL(fileURLWithPath: "/tmp/aquilum-e2e.pdf")
          let pdfWritten = waitFor("PDF written", seconds: 30) {
              ((try? FileManager.default.attributesOfItem(atPath: pdfURL.path)[.size] as? Int) ?? 0) > 0
          }
          var pdfOk = false
          if pdfWritten {
              usleep(500_000)
              if let document = PDFDocument(url: pdfURL) {
                  let text = document.string ?? ""
                  print("PDF pages: \(document.pageCount), characters: \(text.count)")
                  pdfOk = document.pageCount > 0 && text.contains("AQUILUM-PDF-CHECK")
                  print(pdfOk ? "PDF contains the sample text" : "PDF is missing the sample text")
              } else {
                  print("PDF could not be opened")
              }
          }
          exit(windowShown && pdfOk ? 0 : 1)
          EOF
          swiftc -O check.swift -o check
          mkdir -p shots
          open /Applications/Aquilum.app
          status=0
          ./check || status=$?
          screencapture -x shots/window.png
          cp /tmp/aquilum-e2e.pdf shots/ 2>/dev/null || true
          exit $status

      - name: Quit with Cmd+Q path
        if: always()
        run: |
          osascript -e 'quit app "Aquilum"' || true
          for i in $(seq 1 50); do pgrep -x Aquilum >/dev/null || break; sleep 0.2; done
          if pgrep -x Aquilum >/dev/null; then echo "Aquilum still running after quit"; exit 1; fi
          echo "Aquilum quit cleanly"
          ls -la "$HOME/Library/Application Support/com.dmitriy.aquilum-app/"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-branch-check-${{ inputs.ref }}
          path: shots/
          retention-days: 7
