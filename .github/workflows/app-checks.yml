name: Application checks

on:
  pull_request:
    paths:
      - "aquilum-app/Cargo.toml"
      - "aquilum-app/Cargo.lock"
      - "aquilum-app/.cargo/**"
      - "aquilum-app/core/**"
      - "aquilum-app/native/**"
      - ".github/workflows/app-checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: aquilum-app -> ../.artifacts/cargo-native

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libfontconfig1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Run Rust tests
        working-directory: aquilum-app
        run: cargo test --workspace --locked
