[package]
name = "aquilum-app"
version = "0.2.6"
description = "Fast local-first Markdown knowledge base"
authors = ["Dmitriy Chaplinskiy"]
license = "AGPL-3.0-only"
edition = "2021"

[workspace]
members = ["."]

[lib]
name = "aquilum_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
aquilum-core = { path = "../../aquilum-app/core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = { version = "2", optional = true }

[features]
updater = ["dep:tauri-plugin-updater"]

[profile.release]
lto = "thin"
codegen-units = 8
strip = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation"] }

