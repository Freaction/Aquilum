<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquilum</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f6f8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #090b0f; }
      #root { opacity: 0; }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aquilum-theme');
          var theme = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
